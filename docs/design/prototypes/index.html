<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BabySleep — Prototipos Fase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--z:.6}
*{box-sizing:border-box}
body{margin:0;background:#cfcbc2;font-family:system-ui,sans-serif;color:#222}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 24px}
.top h1{font-size:18px;margin:0}
.top button{border:1px solid #888;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.top button[aria-pressed=true]{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:150px repeat(var(--n,5),calc(320px*var(--z)));gap:14px;padding:0 24px 32px;align-items:start}
.cap{font-size:12px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.05em}
.rl{font-size:13px;line-height:1.4}
.rl b{display:block;font-size:16px;margin-bottom:4px}
.sw{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
.sw i{width:18px;height:18px;border-radius:5px;border:1px solid #0002;display:block}
.sc{width:calc(320px*var(--z));height:calc(660px*var(--z))}
.p{width:320px;height:660px;zoom:var(--z);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--fb);box-shadow:0 0 0 7px #151515,0 14px 30px #0004;font-size:14px;line-height:1.3}
.p *{box-sizing:border-box}
.sb{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:12px;font-weight:600;color:var(--fg)}
.bd{flex:1;min-height:0;overflow:hidden;position:relative;padding:0 18px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mu{color:var(--mu)}.tn{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 14px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mu);padding:5px 0}
.nav div.on{color:var(--ac)}
.nav .i{font-size:22px}
/* ===== tema claro/oscuro/noche ===== */
.dA{--fd:'Fraunces',serif;--fb:'DM Sans',sans-serif}
.dA.light{--bg:#f7f0e6;--s1:#fffaf3;--s2:#efe5d6;--fg:#2b2038;--mu:#675b74;--ac:#b9531f;--acfg:#fff;--ln:#e3d7c4;--nap:#e0a43a;--nt:#4a3a7a;--ok:#2f7a4f}
.dA.dark{--bg:#181226;--s1:#231a36;--s2:#2e2445;--fg:#f2e9ff;--mu:#b3a6c9;--ac:#f0955a;--acfg:#2a1406;--ln:#3a2f55;--nap:#f0b855;--nt:#9c88e8;--ok:#7fd1a0}
.dA.night{--bg:#050304;--s1:#0f0a08;--s2:#1a120d;--fg:#d8b48a;--mu:#a38660;--ac:#c27a3e;--acfg:#140a03;--ln:#2a1d14;--nap:#9c7a4a;--nt:#c27a3e;--ok:#8fbf8a}
.dB{--fd:'Newsreader',serif;--fb:'Instrument Sans',sans-serif}
.dB.light{--bg:#f5f0e4;--s1:#f5f0e4;--s2:#ebe4d2;--fg:#22241e;--mu:#5f6153;--ac:#3f6b4f;--acfg:#fff;--ln:#d5cdb8;--nap:#c98f2f;--nt:#35506e;--ok:#3f6b4f}
.dB.dark{--bg:#14160f;--s1:#14160f;--s2:#1e2117;--fg:#ece8d6;--mu:#aaa68f;--ac:#8fbf9a;--acfg:#0f1a12;--ln:#2c3024;--nap:#e0b25a;--nt:#7ea3cc;--ok:#8fbf9a}
.dB.night{--bg:#070604;--s1:#070604;--s2:#14110c;--fg:#cfae7e;--mu:#9a8159;--ac:#b98a45;--acfg:#120c05;--ln:#251e14;--nap:#8a6d3f;--nt:#b98a45;--ok:#8fbf8a}
.dC{--fd:'Manrope',sans-serif;--fb:'Manrope',sans-serif}
.dC.light{--bg:#e9f0f1;--s1:#fff;--s2:#dbe7ea;--fg:#0d2f38;--mu:#4c6a72;--ac:#14707f;--acfg:#fff;--ln:#cfdde0;--nap:#e8b45a;--nt:#1b5a8f;--ok:#1f7a4f}
.dC.dark{--bg:#08171c;--s1:#0f2a31;--s2:#163a43;--fg:#e4f3f5;--mu:#9cbcc3;--ac:#5ec2d1;--acfg:#04181d;--ln:#1d414a;--nap:#f0c070;--nt:#6fa8e8;--ok:#7fd1a0}
.dC.night{--bg:#020506;--s1:#0a1012;--s2:#111a1c;--fg:#c9ad82;--mu:#937e5d;--ac:#b8863f;--acfg:#120c05;--ln:#1d2528;--nap:#8a6d3f;--nt:#b8863f;--ok:#8fbf8a}
.dC.dD.light{--bg:#f7f0e6;--s1:#fffaf3;--s2:#efe5d6;--fg:#2b2038;--mu:#675b74;--ac:#b9531f;--acfg:#fff;--ln:#e3d7c4;--nap:#e0a43a;--nt:#4a3a7a;--ok:#2f7a4f}
.dC.dD.dark{--bg:#181226;--s1:#231a36;--s2:#2e2445;--fg:#f2e9ff;--mu:#b3a6c9;--ac:#f0955a;--acfg:#2a1406;--ln:#3a2f55;--nap:#f0b855;--nt:#9c88e8;--ok:#7fd1a0}
.dC.dD.night{--bg:#050304;--s1:#0f0a08;--s2:#1a120d;--fg:#d8b48a;--mu:#a38660;--ac:#c27a3e;--acfg:#140a03;--ln:#2a1d14;--nap:#9c7a4a;--nt:#c27a3e;--ok:#8fbf8a}
.dC.dD.light .card,.dC.dD.light .tile{box-shadow:0 2px 0 var(--ln),0 12px 24px -16px #2b203866}
/* ===== A · Crepúsculo ===== */
.dA .h1{font-family:var(--fd);font-weight:500;font-size:28px;letter-spacing:-.01em}
.dA .av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--acfg);display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:17px}
.dA .big{font-family:var(--fd);font-weight:500;letter-spacing:-.02em;line-height:1}
.dA .card{background:var(--s1);border-radius:22px;padding:14px}
.dA .card2{background:var(--s2);border-radius:20px;padding:12px}
.dA .btnP{height:62px;border-radius:31px;background:var(--ac);color:var(--acfg);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent)}
.dA.night .btnP{box-shadow:none}
.dA .pill{height:40px;border-radius:20px;background:var(--s1);display:flex;align-items:center;gap:7px;padding:0 13px;font-weight:600;font-size:13.5px}
.dA .nav{background:var(--s1);margin:0 12px 12px;border-radius:26px;padding:6px 4px}
.dA .seg{display:flex;background:var(--s2);border-radius:20px;padding:3px}
.dA .seg span{flex:1;text-align:center;padding:7px 0;border-radius:17px;font-weight:600;font-size:13px;color:var(--mu)}
.dA .seg span.on{background:var(--ac);color:var(--acfg)}
.dA .lab{font-size:12px;font-weight:600;color:var(--mu)}
.dA .lr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln);font-weight:500}
.dA .lr:last-child{border:0}
.dA .lr .i{font-size:20px;color:var(--ac)}
.dA .lr .ch{margin-left:auto;color:var(--mu)}
/* ===== B · Cuaderno ===== */
.dB .h1{font-family:var(--fd);font-weight:500;font-size:34px;letter-spacing:-.02em}
.dB .big{font-family:var(--fd);font-weight:400;letter-spacing:-.03em;line-height:1}
.dB .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.dB hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.dB .btnP{height:54px;border-radius:12px;background:var(--ac);color:var(--acfg);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.dB .btnO{height:42px;border:1.5px solid var(--fg);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;padding:0 12px}
.dB .tabs{display:flex;gap:18px;border-bottom:1px solid var(--ln);font-weight:600;font-size:14px;color:var(--mu);overflow:hidden;white-space:nowrap}
.dB .tabs span{padding:9px 0}
.dB .tabs span.on{color:var(--fg);border-bottom:2.5px solid var(--ac);margin-bottom:-1px}
.dB .led{display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:14.5px}
.dB .led u{flex:1;border-bottom:1.5px dotted var(--ln);text-decoration:none;transform:translateY(-3px)}
.dB .led b{font-family:var(--fd);font-weight:500;font-size:19px}
.dB .nav{border-top:1px solid var(--ln)}
.dB .lr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-weight:500}
.dB .lr .ch{margin-left:auto;color:var(--mu)}
/* ===== C · Marea ===== */
.dC .h1{font-weight:800;font-size:24px;letter-spacing:-.02em}
.dC .big{font-weight:800;letter-spacing:-.04em;line-height:1}
.dC .card{background:var(--s1);border-radius:26px;padding:14px;box-shadow:0 2px 0 var(--ln),0 12px 24px -16px #0a2a3366}
.dC.night .card,.dC.dark .card{box-shadow:none;border:1px solid var(--ln)}
.dC .tile{background:var(--s1);border-radius:22px;padding:12px;box-shadow:0 2px 0 var(--ln)}
.dC.night .tile,.dC.dark .tile{box-shadow:none;border:1px solid var(--ln)}
.dC .round{white-space:nowrap;width:92px;height:92px;border-radius:50%;background:var(--ac);color:var(--acfg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:13px;box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 22%,transparent)}
.dC .round .i{font-size:28px}
.dC .round.s{width:68px;height:68px;font-size:11px;gap:1px;box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 22%,transparent)}.dC .round.s .i{font-size:22px}
.dC.night .round{box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 14%,transparent)}
.dC .chip{height:36px;border-radius:18px;background:var(--s2);display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:12.5px}
.dC .chip.on{background:var(--fg);color:var(--bg)}
.dC .lab{font-size:11.5px;font-weight:700;color:var(--mu);letter-spacing:.02em}
.dC .nav{background:var(--s1);border-top:1px solid var(--ln)}
.dC .nav div.on .i{background:color-mix(in srgb,var(--ac) 18%,transparent);width:44px;height:28px;border-radius:14px;padding:4px 10px;box-sizing:border-box}
.dC .av{width:40px;height:40px;border-radius:50%;background:var(--s2);border:2.5px solid var(--ac);display:grid;place-items:center;font-weight:800}
.dC .tg{position:relative;border-radius:18px;background:var(--s2);padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12.5px;border:2px solid transparent;min-height:60px;text-align:center}
.dC .tg.h{flex-direction:row;gap:8px;min-height:48px;font-size:13.5px}
.dC .tg.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--s2))}
.dC .tg .ck{position:absolute;top:5px;right:7px;color:var(--ac);font-size:14px;display:flex}
.dC .tg small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.bd.scr{overflow-y:auto;scrollbar-width:none;padding-bottom:16px}.bd.scr::-webkit-scrollbar{display:none}
.dC.dD{--dg:#b3261e}.dC.dD.dark,.dC.dD.night{--dg:#ff8f85}
.note button{border:1px solid #888;background:#fff;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.lg{background:#fff9;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.lgh b{display:block;font-size:17px;margin-bottom:4px}.lgh span{font-size:13px;line-height:1.5;color:#333}
.lgr{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.lgc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.lgc small{font-size:11px;color:#555;font-weight:600}
.sc.sm{height:calc(570px*var(--z))}.p.sm{height:570px}
.note{grid-column:1/-1;max-width:980px;font-size:13.5px;line-height:1.5;background:#fff8;border-radius:12px;padding:12px 16px}
.note h2{font-size:15px;margin:0 0 6px}.note ul{margin:6px 0 0;padding-left:18px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,calc(320px*var(--z)))}.rl,.cap{grid-column:1/-1}.grid>div:empty{display:none}}
</style>
</head>
<body>
<div class="top">
  <h1>BabySleep · Fase 2 — tres direcciones</h1>
  <span class="cap">Vista</span><button data-v="screens" aria-pressed="true">Pantallas</button><button data-v="access" aria-pressed="false">Acceso (D)</button><button data-v="flow" aria-pressed="false">Tomas y sueño (D)</button><button data-v="review" aria-pressed="false">Revisión UX</button><button data-v="app" aria-pressed="false">App actual (D)</button><button data-v="logo" aria-pressed="false">Logo</button><button data-v="nav" aria-pressed="false">Navegación y desplegables</button><button data-v="pk" aria-pressed="false">Pestañas interiores</button><button data-v="dm" aria-pressed="false">Empezar a dormir</button>
  <span class="cap">Tamaño</span>
  <button data-z=".45" aria-pressed="false">S</button><button data-z=".6" aria-pressed="true">M</button><button data-z=".85" aria-pressed="false">L</button><button data-z="1" aria-pressed="false">1:1</button>
  <span class="cap">Pantalla</span><button data-s="all" aria-pressed="true">Todas</button><button data-s="0" aria-pressed="false">Hoy</button><button data-s="1" aria-pressed="false">Activa</button><button data-s="2" aria-pressed="false">Stats</button><button data-s="3" aria-pressed="false">Salud</button><button data-s="4" aria-pressed="false">Noche</button>
  <span class="cap">Filas</span>
  <button data-r="all" aria-pressed="true">Todas</button><button data-r="A" aria-pressed="false">A</button><button data-r="B" aria-pressed="false">B</button><button data-r="C" aria-pressed="false">C</button><button data-r="D" aria-pressed="false">D</button>
</div>
<div class="grid" id="grid"></div>
<script>
const P={
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
chev:'<path d="m9 18 6-6-6-6"/>',
down:'<path d="m6 9 6 6 6-6"/>',
bottle:'<path d="M10 2h4M10 2v3M14 2v3M8 8a2 2 0 0 1 2-3h4a2 2 0 0 1 2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM8 13h8"/>',
drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',
pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
therm:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
solids:'<path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/><path d="M7 21h10"/><path d="M19.5 12 22 6"/><path d="M11.25 3c.27.1.8.53.74 1.36-.05.83-.93 1.2-.98 2.02-.06.78.33 1.24.72 1.62"/><path d="M6.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.74 1.62"/>'};
const I=(n,s)=>`<svg class="i" viewBox="0 0 24 24" ${s?`style="font-size:${s}px"`:''}>${P[n]}</svg>`;
const sb=()=>`<div class="sb"><span>9:41</span><span class="row" style="gap:5px">${I('bell',12)}<b>78%</b></span></div>`;
const nav=on=>`<div class="nav">${[['moon','Inicio'],['heart','Salud'],['chart','Estadísticas'],['sliders','Ajustes']].map((x,i)=>`<div class="${i==on?'on':''}">${I(x[0])}<span>${x[1]}</span></div>`).join('')}</div>`;
const ring=(sz,pct,sw,col,track,inner)=>{const r=(sz-sw)/2,c=2*Math.PI*r;return `<div style="position:relative;width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${inner}</div></div>`};
const DAYS=[['L',3.2,10.1],['M',2.8,10.4],['X',3.5,9.8],['J',3.0,10.6],['V',2.5,10.2],['S',3.4,9.9],['D',1.7,0]];
const F=n=>String(n).replace('.',',');
const dr={A:{n:'A · Crepúsculo',t:'Cálida, serif suave, píldoras táctiles',sw:['#f7f0e6','#b9531f','#e0a43a','#4a3a7a','#181226','#f0955a','#050304','#c27a3e']},
B:{n:'B · Cuaderno',t:'Editorial, papel y tinta, listas sin cajas',sw:['#f5f0e4','#3f6b4f','#c98f2f','#35506e','#14160f','#8fbf9a','#070604','#b98a45']},
D:{n:'D · Marea Crepúsculo',t:'Estructura de Marea (anillo, mosaicos) con la paleta de Crepúsculo',sw:['#f7f0e6','#b9531f','#e0a43a','#4a3a7a','#181226','#f0955a','#050304','#c27a3e']},
C:{n:'C · Marea',t:'Anillos y mosaicos, geométrica, aire nórdico',sw:['#e9f0f1','#14707f','#e8b45a','#1b5a8f','#08171c','#5ec2d1','#020506','#b8863f']}};

function phone(d,sc,theme){const [,k,navOn,night]=sc;const th=night?'night':theme;const f=M[d][k];const body=k=='active'?f(!!night):f();const dark=th!='light';return `<div class="sc"><div class="p ${d=='D'?'dC dD':'d'+d} ${th}">${sb()}${body}${nav(navOn)}</div></div>`}

['2 · Registro: tu bebé',()=>aWrap(`<div class="h1" style="font-size:26px;margin-top:6px">¿Cómo se llama tu bebé?</div><p class="mu" style="font-size:14px;font-weight:500;margin:8px 0 18px">Solo necesitamos un nombre o alias y su fecha de nacimiento para calcular su edad.</p><div style="display:flex;justify-content:center;margin-bottom:18px"><div class="av" style="width:76px;height:76px;font-size:32px;border-width:3.5px">L</div></div>${aField('Nombre o alias del bebé','Leo',{focus:1})}${aField('Fecha de nacimiento','10/05/2026',{})}`,`${aBtn('Crear perfil')}`,aBack)],
['3 · Entrar: correo',()=>aWrap(`<div style="width:56px;height:56px;border-radius:50%;background:var(--ac-soft,color-mix(in srgb,var(--ac) 18%,transparent));display:grid;place-items:center;color:var(--ac);font-size:28px;margin-top:6px">${I('user')}</div><div class="h1" style="font-size:26px;margin-top:14px">Entra con tu correo</div><p class="mu" style="font-size:14px;font-weight:500;margin:8px 0 20px;line-height:1.45">Trae a este móvil a tu bebé y todos sus registros. No se crea ningún perfil nuevo.</p>${aField('Tu correo','ana@correo.com',{focus:1,msg:'Sin contraseñas: te enviamos un código.'})}`,`${aBtn('Enviarme un código')}`,aBack)],
['4 · Entrar: código',()=>aWrap(`<div class="h1" style="font-size:26px;margin-top:6px">Revisa tu correo</div><p class="mu" style="font-size:14px;font-weight:500;margin:8px 0 22px;line-height:1.45">Te hemos enviado un código de 6 dígitos a <b style="color:var(--fg)">ana@correo.com</b>.</p><div style="display:flex;gap:8px;justify-content:space-between;margin-bottom:12px">${[4,8,1,'','',''].map((d,i)=>`<div style="flex:1;height:60px;border-radius:16px;background:var(--s2);border:2px solid ${i==3?'var(--ac)':'transparent'};display:grid;place-items:center;font-size:24px;font-weight:800" class="tn">${d}</div>`).join('')}</div><div class="mu" style="font-size:13px;font-weight:600">¿No llega? <span style="color:var(--ac)">Reenviar en 0:42</span></div>`,`<div style="display:flex;flex-direction:column;gap:6px">${aBtn('Entrar')}${aBtn('Cambiar de correo',{ghost:1})}</div>`,aBack)],

['7 · Traer mis datos',()=>aWrap(`<div style="text-align:center;margin-top:60px"><div style="width:96px;height:96px;border-radius:50%;margin:0 auto;background:color-mix(in srgb,var(--ok) 18%,transparent);display:grid;place-items:center;color:var(--ok);font-size:48px">${I('check')}</div><div class="h1" style="font-size:26px;margin-top:18px">Cuenta vinculada</div><p class="mu" style="font-size:14px;font-weight:500;margin:10px 8px 0;line-height:1.45">Se descargan a este móvil el bebé y los registros de la familia.</p></div><div class="card2" style="margin-top:26px;display:flex;gap:12px;align-items:center;background:var(--s2);border-radius:20px;padding:12px"><div class="av" style="width:44px;height:44px;font-size:19px">L</div><div><div style="font-weight:800">Leo</div><div class="mu" style="font-size:12.5px;font-weight:600">5 meses · 2 cuidadores</div></div></div>`,`${aBtn('Traer mis datos')}`)]

function renderAccess(z){document.documentElement.style.setProperty('--z',z);document.documentElement.style.setProperty('--n',5);const g=document.getElementById('grid');let h='<div></div>'.repeat(0);const mk=(i,th)=>{const a=ACC[i];return `<div><div class="cap" style="margin-bottom:8px">${a[0]}${th=='night'?' · noche':''}</div><div class="sc"><div class="p dC dD ${th}">${sb()}${a[1]()}</div></div></div>`};

const fAct=(rd,hint)=>`<div style="margin-top:-52px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px">${rd}${hint?`<div class="mu" style="font-size:11.5px;font-weight:600;text-align:center;max-width:230px">${hint}</div>`:''}</div>`;

function renderFlow(z){document.documentElement.style.setProperty('--z',z);const g=document.getElementById('grid');let h=`<div class="note"><h2>Toma con anillo dentro de «Hoy» y sueño en dos pasos (dirección D)</h2><b>Pestañas de Inicio:</b> Hoy · Previsión · Tomas (como estaba) · <b>Sueño</b> (antes «Historial»).<br><b>Toma en «Hoy».</b> Debajo del anillo de sueño, que sigue siendo la acción principal, hay una tarjeta «Toma» con su mini anillo y un botón circular pequeño. En reposo el anillo cuenta el tiempo desde la última toma y debajo está el intervalo habitual (nunca un objetivo). «Toma» arranca el cronómetro sin preguntar nada; <b>al terminar</b> se abre una hoja donde se dice qué ha tomado: pecho (izquierdo, derecho o los dos), biberón (con ml) o sólidos, combinables y todo opcional.<ul><li>Pecho izq. + dcho. = «ambos»; pecho + biberón = «mixta»: se guarda con los tipos que ya existen, sin cambiar el modelo de datos.</li><li>La pestaña «Tomas» queda como estaba (listado y edición).</li><li>Los dos botones circulares conviven: el de sueño, grande; el de toma, pequeño, para que haya una sola acción dominante.</li></ul><b>Sueño.</b> «Dormir» ya no empieza como noche por defecto: primero se abre el <b>modo de sueño</b> (Siesta o Noche, sugerido por la hora pero de un toque) y «¿cómo se duerme?» (en brazos, <b>porteo</b>, cuna, paseo, coche, tras comer). Después «Ya duerme» inicia el sueño o «Prepararlo para dormir» inicia la preparación, y «Duerme» pasa al sueño real con el mismo modo y etiquetas.<ul><li>«Porteo» ya existe como etiqueta al dormirse; falta añadirla a las de preparación (etiqueta de catálogo, no cambia el modelo).</li><li>En las pantallas de sueño en curso se muestra la tarjeta Toma (tomas de madrugada); lo demás (corregir inicio, despertares) queda debajo, con scroll.</li></ul></div>`;
for(const [name,list] of FLOW){h+=`<div class="note" style="background:none;padding:6px 0;font-weight:800;font-size:16px">${name}</div>`+list.map(([cap,f,th])=>`<div><div class="cap" style="margin-bottom:8px">${cap}${th=='night'?' · noche':''}</div><div class="sc"><div class="p dC dD ${th}">${sb()}${f()}${nav(0)}</div></div></div>`).join('')}
g.innerHTML=h;g.style.gridTemplateColumns='repeat(auto-fill,calc(320px*var(--z)))'}

const nvNote=()=>`<div class="note"><h2>Navegación: volver a la primera pestaña, y desplegables</h2>
<b>1 · Pulsar la sección vuelve a su primera pestaña.</b> Me parece buena idea: es lo que hacen las apps del sistema (volver a tocar la pestaña activa te lleva al principio), ahorra toques y quita la sensación de estar «perdido» en una pestaña interior. Lo que propongo:
<table style="border-collapse:collapse;font-size:12.5px;margin:8px 0;width:100%"><thead><tr style="text-align:left;border-bottom:2px solid #0003"><th style="padding:5px 8px">Pulsas…</th><th style="padding:5px 8px">Estando en…</th><th style="padding:5px 8px">Pasa</th></tr></thead><tbody>
<tr style="border-bottom:1px solid #0002"><td style="padding:5px 8px"><b>Inicio</b></td><td style="padding:5px 8px">Previsión, Tomas o Sueño</td><td style="padding:5px 8px">Va a <b>Hoy</b></td></tr>
<tr style="border-bottom:1px solid #0002"><td style="padding:5px 8px"><b>Salud</b></td><td style="padding:5px 8px">cualquier pestaña menos Resumen</td><td style="padding:5px 8px">Va a <b>Resumen</b></td></tr>
<tr style="border-bottom:1px solid #0002"><td style="padding:5px 8px"><b>Estadísticas</b></td><td style="padding:5px 8px">cualquier vista menos Resumen</td><td style="padding:5px 8px">Va a <b>Resumen</b></td></tr>
<tr style="border-bottom:1px solid #0002"><td style="padding:5px 8px"><b>Ajustes</b></td><td style="padding:5px 8px">con la pantalla desplazada</td><td style="padding:5px 8px">Sube arriba (animado)</td></tr>
<tr style="border-bottom:1px solid #0002"><td style="padding:5px 8px"><b>Cualquiera</b></td><td style="padding:5px 8px">ya en la primera pestaña, desplazada</td><td style="padding:5px 8px">Sube arriba (mismo gesto en toda la app)</td></tr>
<tr><td style="padding:5px 8px"><b>Cualquiera</b></td><td style="padding:5px 8px">viniendo de otra sección</td><td style="padding:5px 8px">Abre su <b>primera</b> pestaña</td></tr></tbody></table>
<b>Cosas a decidir:</b> (a) <u>Al venir de otra sección</u>, recomiendo abrir siempre la primera pestaña (predecible: Inicio = Hoy). La alternativa es recordar dónde estabas hasta que vuelvas a pulsar, pero eso trae de vuelta el problema de «¿dónde estoy?». (b) <u>Coste</u>: se pierde el sitio en una lista larga (Historial, vacunas) al pulsar Inicio o Salud; es lo esperado, y con los desplegables de abajo las listas son mucho más cortas. (c) La fila de pestañas también vuelve a su inicio (si Salud estaba desplazada hasta «Ficha», «Resumen» debe verse). (d) Accesibilidad: el cambio se anuncia («Resumen») y el foco va al título de la sección.
